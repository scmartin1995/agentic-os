<!doctype html>
<meta charset="utf-8">
<title>Agentic OS</title>
<style>
  html, body { margin: 0; height: 100%; background: #161616; color: #f4f4f4; font: 16px/1.5 'Segoe UI', system-ui, sans-serif; }
  body { display: grid; place-items: center; -webkit-app-region: drag; }
  .card { max-width: 460px; padding: 28px 32px; border: 1px solid rgba(80, 220, 240, .25); border-radius: 14px; background: rgba(20, 28, 34, .6); box-shadow: 0 0 40px rgba(60, 200, 230, .08); }
  h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; color: #78a9ff; }
  p { margin: 0; color: #a8a8a8; }
  .dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #78a9ff; animation: p 1.2s ease-in-out infinite; }
  .dot.off { animation: none; background: #be95ff; }
  @keyframes p { 50% { opacity: .25; } }
</style>
<div class="card">
  <h1><span class="dot" id="dot"></span><span id="title">Agentic OS is getting ready</span></h1>
  <p id="msg"></p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('msg').textContent = q.get('reason') || '';
  if (!q.get('retry')) { document.getElementById('dot').classList.add('off'); document.getElementById('title').textContent = 'Agentic OS needs a restart'; }
</script>
